<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#212121" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="VidChat Live Studio — realtime AI video with your rented GPU." />
  <title>VidChat — Live Studio</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23fff'/%3E%3Cpath d='M10 10h12v12H10z' fill='%2310a37f'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="btn-new" type="button" data-open-gpu>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Add GPU server
        </button>
        <nav class="nav-links">
          <a class="nav-link" href="index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Chat
          </a>
          <a class="nav-link active" href="studio.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3V9z"/></svg>
            Live Studio
          </a>
          <button class="nav-link" type="button" data-open-gpu>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v12H4z"/><path d="M8 18v2M16 18v2M9 10h6M9 14h4"/></svg>
            GPU Servers
          </button>
        </nav>
      </div>
      <div class="chat-list" style="padding:12px">
        <p style="font-size:13px;color:var(--text-muted);line-height:1.5">
          Live Studio streams your camera to the <strong>Deployed</strong> GPU URL
          (<code style="color:var(--text)">/v1/stream</code>) and shows the AI output.
        </p>
      </div>
      <div class="sidebar-bottom">
        <button class="gpu-pill" type="button" data-open-gpu>
          <span class="dot" data-gpu-dot></span>
          <span class="meta">
            <strong data-gpu-name>No GPU deployed</strong>
            <span data-gpu-url>Import a server to start</span>
          </span>
        </button>
      </div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button class="model-select" type="button">
          Live Studio
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="version-tabs" style="margin-left:4px">
          <a href="index.html">Chat</a>
          <a class="active" href="studio.html">Live</a>
        </div>
        <div class="top-actions">
          <span class="live-dot" id="live-indicator">Idle</span>
          <button class="icon-btn" type="button" data-open-gpu title="GPU Servers">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </header>

      <div class="studio-grid">
        <div class="stage">
          <span class="stage-label">Camera</span>
          <video id="cam" playsinline muted autoplay></video>
          <div class="stage-placeholder" id="cam-ph">Allow camera to preview</div>
        </div>
        <div class="stage">
          <span class="stage-label">AI output</span>
          <img id="ai-out" alt="AI stream" style="width:100%;height:100%;object-fit:cover;display:none" />
          <canvas id="ai-canvas" style="display:none;width:100%;height:100%"></canvas>
          <div class="stage-placeholder" id="ai-ph">Deploy a GPU server, then Go Live</div>
        </div>
      </div>

      <div class="studio-controls">
        <div class="composer">
          <textarea id="style-prompt" rows="1" placeholder="Style prompt for live transform (e.g. cinematic neon city)…"></textarea>
        </div>
        <div class="studio-bar">
          <button class="btn btn-secondary" id="btn-cam" type="button">Enable camera</button>
          <button class="btn btn-primary" id="btn-live" type="button">Go Live</button>
          <button class="btn btn-danger" id="btn-stop" type="button" disabled>Stop</button>
          <button class="btn btn-secondary" id="btn-snap" type="button" disabled>Download frame</button>
        </div>
        <p class="composer-hint">Frames POST to your deployed stream endpoint. Clean export keeps overlays off.</p>
      </div>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/gpu-panel.js"></script>
  <script src="js/studio.js"></script>
</body>
</html>
