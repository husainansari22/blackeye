<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#212121" id="theme-color" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="VidChat — ChatGPT-style AI photo & video generation with bring-your-own GPU." />
  <title>VidChat</title>
  <meta http-equiv="Cache-Control" content="no-cache" />
  <link rel="stylesheet" href="css/app.css?v=3" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("vidchat.theme") || "dark";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23fff'/%3E%3Cpath d='M10 10h12v12H10z' fill='%2310a37f'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="btn-new" id="btn-new-chat" type="button" title="New chat">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          New chat
        </button>
        <nav class="nav-links">
          <button class="nav-link active" type="button" id="nav-chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Chat
          </button>
          <button class="nav-link" type="button" data-open-gpu>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v12H4z"/><path d="M8 18v2M16 18v2M9 10h6M9 14h4"/></svg>
            GPU Servers
          </button>
        </nav>
      </div>
      <div class="chat-list" id="chat-list"></div>
      <div class="sidebar-bottom">
        <div class="theme-toggle" role="group" aria-label="Theme">
          <button type="button" id="theme-dark" data-theme-set="dark" title="Dark mode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
            Dark
          </button>
          <button type="button" id="theme-light" data-theme-set="light" title="Light mode">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            Light
          </button>
        </div>
        <button class="gpu-pill" type="button" data-open-gpu>
          <span class="dot" data-gpu-dot></span>
          <span class="meta">
            <strong data-gpu-name>No GPU deployed</strong>
            <span data-gpu-url>Import a server to start</span>
          </span>
        </button>
      </div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Open sidebar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button class="model-select" type="button" id="model-label">
          VidChat
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="top-actions">
          <button class="icon-btn" type="button" data-open-gpu title="GPU Servers">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
          <button class="top-new-btn" id="btn-new-chat-top" type="button" aria-label="New chat" title="New chat">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="messages-inner" id="messages-inner"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer-inner">
          <div class="mode-bar">
            <div class="mode-seg" role="group" aria-label="Generate type">
              <button type="button" id="mode-video" class="active" data-mode="video">Video</button>
              <button type="button" id="mode-photo" data-mode="photo">Photo</button>
            </div>
          </div>

          <div class="attach-strip" id="attach-strip"></div>

          <form class="composer" id="composer">
            <div class="composer-tools">
              <button class="tool-btn" type="button" id="btn-attach" title="Upload photo or video" aria-label="Upload">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
              </button>
              <input type="file" id="file-input" accept="image/*,video/*" multiple hidden />
              <input type="file" id="file-input-image" accept="image/*" hidden />
            </div>
            <textarea id="prompt" rows="1" placeholder="Message VidChat…" enterkeyhint="send"></textarea>
            <button class="send-btn" id="send" type="submit" aria-label="Send" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5L20 4l-7.5 17-2.2-7.3L3 11.5z"/></svg>
            </button>
          </form>
          <p class="composer-hint">Upload a reference photo/video, pick Photo or Video, then describe what to make. Clean export on.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/store.js?v=3"></script>
  <script src="js/theme.js?v=3"></script>
  <script src="js/gpu-panel.js?v=3"></script>
  <script src="js/animate-panel.js?v=3"></script>
  <script src="js/chat.js?v=3"></script>
</body>
</html>
