<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vid2Vid Studio</title>
  <link rel="stylesheet" href="/static/css/app.css?v=2" />
</head>
<body class="studio-body">
  <header class="topbar">
    <div class="brand compact"><span class="dot" id="status-dot"></span> Vid2Vid Studio</div>
    <div class="stats" id="stats">Starting GPU…</div>
  </header>

  <div id="camera-banner" class="banner hidden"></div>

  <main class="studio-layout">
    <!-- Row 1: Live video -->
    <section class="panel video-panel">
      <div class="video-col">
        <h2>Your camera</h2>
        <video id="input-video" autoplay playsinline muted></video>
      </div>
      <div class="video-col">
        <h2>AI output</h2>
        <canvas id="output-canvas"></canvas>
      </div>
      <div class="stream-actions">
        <button id="start-btn" class="btn-primary">▶ Start streaming</button>
        <button id="stop-btn" class="btn-secondary" disabled>■ Stop</button>
        <label class="file-btn">
          Or use video file
          <input id="video-file" type="file" accept="video/*" hidden />
        </label>
      </div>
    </section>

    <!-- Row 2: Reference + settings -->
    <aside class="sidebar">
      <section class="panel">
        <h2>① Reference photo</h2>
        <p class="hint">Upload the look you want. Your stream transforms toward this image.</p>
        <img id="reference-preview" alt="Reference" class="reference-preview hidden" />
        <div id="reference-empty" class="reference-empty">No photo yet</div>
        <input id="reference-file" type="file" accept="image/jpeg,image/png,image/webp" hidden />
        <div class="btn-row">
          <button type="button" id="upload-reference" class="btn-secondary">Upload photo</button>
          <button type="button" id="clear-reference" class="btn-secondary" disabled>Remove</button>
        </div>
        <label>Style strength <span id="ref-strength-val">0.65</span></label>
        <input id="reference-strength" type="range" min="0.1" max="1.0" step="0.05" value="0.65" />
      </section>

      <section class="panel">
        <h2>② Prompt</h2>
        <textarea id="prompt" rows="2" placeholder="Describe the look…">portrait, cinematic lighting, detailed</textarea>
        <label>Negative prompt</label>
        <textarea id="negative-prompt" rows="2">blurry, low quality, distorted, ugly</textarea>
        <div class="sliders">
          <label>Transform strength <span id="strength-val">0.45</span></label>
          <input id="strength" type="range" min="0.05" max="0.95" step="0.05" value="0.45" />
          <label>Quality steps <span id="steps-val">4</span></label>
          <input id="steps" type="range" min="1" max="6" step="1" value="4" />
        </div>
        <input type="hidden" id="width" value="512" />
        <input type="hidden" id="height" value="512" />
        <button id="apply-settings" class="btn-secondary">Save settings</button>
      </section>

      <section class="panel obs-panel">
        <h2>③ OBS output</h2>
        <div class="copy-row">
          <input id="obs-url" readonly value="{{ obs_url }}" />
          <button type="button" id="copy-obs" class="btn-secondary">Copy</button>
        </div>
        <p class="hint">OBS → Sources → Browser → paste URL (1920×1080)</p>
      </section>
    </aside>
  </main>

  <script>window.VID2VID_TOKEN = "{{ token }}";</script>
  <script src="/static/js/studio.js?v=2"></script>
</body>
</html>
