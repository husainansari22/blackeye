<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KelvinOz OBS Output</title>
  <style>
    html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
    canvas, video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    #msg {
      position: absolute; inset: 0; display: grid; place-items: center;
      color: #d7cfc4; font-family: Manrope, system-ui, sans-serif; text-align: center; padding: 2rem;
    }
  </style>
</head>
<body>
  <div id="msg">Open the main studio, go live, then this OBS view will mirror the output.</div>
  <canvas id="obs-canvas" width="1280" height="720" hidden></canvas>
  <script>
    const msg = document.getElementById("msg");
    const canvas = document.getElementById("obs-canvas");
    const ctx = canvas.getContext("2d");
    const bc = new BroadcastChannel("kelvinoz-live-frames");
    bc.onmessage = (ev) => {
      if (!ev.data || ev.data.type !== "frame") return;
      const img = new Image();
      img.onload = () => {
        msg.hidden = true;
        canvas.hidden = false;
        ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      };
      img.src = ev.data.dataUrl;
    };
  </script>
</body>
</html>
