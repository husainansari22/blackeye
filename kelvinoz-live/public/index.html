<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KelvinOz Live</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/studio.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand-wrap">
      <p class="brand">KelvinOz Live</p>
    </div>
    <div class="topbar-actions">
      <span id="gpu-pill" class="pill pill-off">Lucy offline</span>
      <button id="start-btn" type="button">Start live</button>
      <button id="stop-btn" type="button" class="ghost" disabled>Stop</button>
      <button id="logout" type="button" class="ghost">Log out</button>
    </div>
  </header>

  <main class="dual-stage">
    <section class="feed-panel">
      <h2 class="feed-label">Webcam Source</h2>
      <div class="feed-box">
        <video id="camera" playsinline muted autoplay></video>
        <div id="camera-empty" class="feed-placeholder">Camera off</div>
      </div>
    </section>

    <section class="feed-panel">
      <h2 class="feed-label">Live Output</h2>
      <div class="feed-box">
        <video id="output" playsinline autoplay muted></video>
        <div id="output-empty" class="feed-placeholder">Waiting</div>
      </div>
    </section>
  </main>

  <section class="controls">
    <div class="control-card">
      <h3>Character photo</h3>
      <p class="tiny">Full character swap reference for Lucy 2.5</p>
      <label class="file-btn">
        Choose photo
        <input id="photo" type="file" accept="image/png,image/jpeg,image/webp" hidden />
      </label>
      <img id="photo-preview" alt="" hidden />
    </div>
    <div class="control-card">
      <h3>Background / scene</h3>
      <textarea id="prompt" rows="3" placeholder="Example: replace the background with a neon Tokyo street at night"></textarea>
    </div>
    <div class="control-card">
      <h3>OBS connect</h3>
      <div class="obs-row">
        <input id="obs-url" readonly />
        <button id="copy-obs" type="button" class="ghost">Copy</button>
      </div>
      <p id="status-text" class="status-text">Ready · Lucy 2.5 — close OBS camera first if Start fails</p>
    </div>
  </section>

  <script src="/assets/studio.bundle.js"></script>
</body>
</html>
