<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#212121" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="description" content="VidChat — ChatGPT-style AI realtime video generation with bring-your-own GPU." />
  <title>VidChat — AI Video</title>
  <link rel="stylesheet" href="css/app.css" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23fff'/%3E%3Cpath d='M10 10h12v12H10z' fill='%2310a37f'/%3E%3C/svg%3E" />
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <button class="btn-new" id="btn-new-chat" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          New chat
        </button>
        <nav class="nav-links">
          <a class="nav-link active" href="index.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            Chat
          </a>
          <a class="nav-link" href="studio.html">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9l5 3-5 3V9z"/></svg>
            Live Studio
          </a>
          <button class="nav-link" type="button" data-open-gpu>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 6h16v12H4z"/><path d="M8 18v2M16 18v2M9 10h6M9 14h4"/></svg>
            GPU Servers
          </button>
        </nav>
      </div>
      <div class="chat-list" id="chat-list"></div>
      <div class="sidebar-bottom">
        <button class="gpu-pill" type="button" data-open-gpu>
          <span class="dot" data-gpu-dot></span>
          <span class="meta">
            <strong data-gpu-name>No GPU deployed</strong>
            <span data-gpu-url>Import a server to start</span>
          </span>
        </button>
      </div>
    </aside>

    <div class="backdrop" id="backdrop"></div>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menu-btn" aria-label="Open menu">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <button class="model-select" type="button" title="Version">
          VidChat
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="version-tabs" style="margin-left:4px">
          <a class="active" href="index.html">Chat</a>
          <a href="studio.html">Live</a>
        </div>
        <div class="top-actions">
          <button class="icon-btn" type="button" data-open-gpu title="GPU Servers">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          </button>
        </div>
      </header>

      <div class="messages" id="messages">
        <div class="messages-inner" id="messages-inner"></div>
      </div>

      <div class="composer-wrap">
        <div class="composer-inner">
          <form class="composer" id="composer">
            <textarea id="prompt" rows="1" placeholder="Describe a video to generate…" enterkeyhint="send"></textarea>
            <button class="send-btn" id="send" type="submit" aria-label="Send" disabled>
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M3 11.5L20 4l-7.5 17-2.2-7.3L3 11.5z"/></svg>
            </button>
          </form>
          <p class="composer-hint">BYO GPU · Clean export (no app watermarks). Platforms may still apply their own policies.</p>
        </div>
      </div>
    </main>
  </div>

  <script src="js/store.js"></script>
  <script src="js/gpu-panel.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
