# Nginx: HTTPS on 443 (camera) + HTTP on 80 (legacy port 20001)
# Uvicorn backend on 127.0.0.1:8080

upstream avatar_backend {
    server 127.0.0.1:8080;
}

# HTTP — Hostinger expose internal 80 → public :20001
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    client_max_body_size 25M;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://avatar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_read_timeout 3600s;
    }
}

# HTTPS — expose internal 443 → public :20002 (webcam works)
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    client_max_body_size 25M;

    ssl_certificate     /etc/nginx/ssl/avatar.crt;
    ssl_certificate_key /etc/nginx/ssl/avatar.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://avatar_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 3600s;
    }
}
